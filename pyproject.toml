[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wasds150"
version = "0.1.0"
description = "Generate Uniden SDS150 Favorites Lists from the Washington catalog (local CLI + browser UI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "washington-sds150-favorites contributors" }]
# Deliberately dependency-free at runtime; development tooling is optional.
dependencies = []

[project.urls]
Homepage = "https://github.com/NiyaNagi/washington-sds150-favorites"
Changelog = "https://github.com/NiyaNagi/washington-sds150-favorites/blob/main/CHANGELOG.md"
Issues = "https://github.com/NiyaNagi/washington-sds150-favorites/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
wasds150 = "wasds150.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wasds150" = ["data/*.json", "webui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
